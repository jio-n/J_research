<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JIMTOF 現地メモ 最小PoC</title>
<style>
*{box-sizing:border-box}body{font:16px/1.55 system-ui,sans-serif;margin:auto;max-width:850px;padding:16px;background:#f4f6f8;color:#172838}h1{font-size:23px}h2{font-size:20px}h3{font-size:18px}button,input,textarea{font:inherit}button,.file{display:inline-block;background:#155b79;color:white;border:0;border-radius:7px;padding:10px 13px;margin:4px 3px 4px 0;cursor:pointer}input[type=search],input[type=text],textarea{width:100%;padding:10px;border:1px solid #95a6b5;border-radius:6px}textarea{min-height:100px;resize:vertical}.card{background:white;padding:16px;margin:12px 0;border:1px solid #d7e0e6;border-radius:10px}.muted,small{color:#506375}.warning{background:#fff3cd;padding:10px;border-radius:6px}.hidden{display:none}label{display:block;margin-top:8px}.file input{display:none}img{max-width:100%;max-height:280px}audio{max-width:100%}.attachment{border-top:1px solid #ddd;padding:10px 0;overflow-wrap:anywhere}details{margin-top:10px}summary{cursor:pointer}#status{position:sticky;top:0;background:#e3f1f5;padding:10px;z-index:1}.danger{background:#8c3342}a{color:#155b79}
</style>
<h1>JIMTOF 現地メモ <small>最小PoC</small></h1>
<div id="status" role="status" aria-live="polite">保存機能を確認中</div>
<p class="warning">iPhone の file:// での保存・出力・録音は未検証です。保存表示を確認し、JSON / ZIP をこまめに書き出してください。写真・録音は会場規則と相手の同意に従ってください。</p>
<div class="card">
 <button id="jsonExport">JSON バックアップ</button><button id="zipExport">ZIP バックアップ</button>
 <label class="file">バックアップ復元<input id="restore" type="file" accept=".json,.zip,application/json,application/zip"></label>
 <details><summary>出展社マスターの取込</summary><p>年度別 CSV または JSON を取込。既存メモは保持し、同一年度・企業・ブースの企業情報を更新します。</p><label class="file">CSV / JSON 選択<input id="master" type="file" accept=".csv,.json,text/csv,application/json"></label><p id="masterStatus" class="muted">初期表示は架空サンプル 2 社です。公式データではありません。</p></details>
</div>
<label for="search">企業名・ブース検索</label><input id="search" type="search" placeholder="企業名またはブース番号">
<div id="companies"></div><section id="editor"></section>
<script>
'use strict';
const KEY='jimtof-field-poc-v1';
const sample=[{id:'sample-a',year:'2026',name:'【架空サンプル】自動化技術 A',booth:'TEST-A',candidates:[{name:'【架空】加工監視',overview:'異常の発見を支援する技術の確認',reason:'実際の適用条件と制約を確認',questions:'顧客の困りごと／方式選択理由／市場規模と算定根拠／受注・PoC実績／2024年との違い',detail:'架空サンプル。展示確定情報ではありません。',difference:'要現地確認',source:''}]},{id:'sample-b',year:'2024',name:'【架空サンプル】計測技術 B',booth:'TEST-B',candidates:[]}];
let state={format:'jimtof-field-poc',version:1,updatedAt:null,companies:sample,records:{}},selected=null,recorder=null,recordingItem=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
function valid(s){return s?.format==='jimtof-field-poc'&&s.version===1&&Array.isArray(s.companies)&&s.companies.every(c=>typeof c.id==='string'&&typeof c.name==='string')&&s.records&&typeof s.records==='object'&&!Array.isArray(s.records)&&Object.values(s.records).every(r=>r&&typeof r.memo==='string'&&Array.isArray(r.items)&&r.items.every(i=>i&&typeof i.id==='string'&&typeof i.name==='string'&&typeof i.note==='string'&&Array.isArray(i.attachments)&&i.attachments.every(a=>a&&typeof a.name==='string'&&typeof a.data==='string'&&a.data.startsWith('data:'))));}
function save(){state.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));$('status').textContent='端末内保存済み '+new Date().toLocaleTimeString('ja-JP')+'（バックアップ推奨）';return true;}catch(e){$('status').textContent='端末内保存失敗：'+e.message+'。現在のデータを JSON / ZIP に書き出してください。';return false;}}
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!valid(parsed))throw Error('保存データ形式が不正');state=parsed;$('status').textContent='前回の端末内保存を復元しました';}else{$('status').textContent='未保存：記録の変更時に端末内保存を試みます';}}catch(e){$('status').textContent='端末内保存を利用できません：'+e.message+'。バックアップを利用してください。';}
function record(){return state.records[selected]||(state.records[selected]={memo:'',items:[]});}
function renderList(){const q=$('search').value.toLocaleLowerCase();$('companies').innerHTML=state.companies.filter(c=>(c.name+' '+c.booth+' '+c.year).toLocaleLowerCase().includes(q)).map(c=>`<button data-company="${esc(c.id)}">${esc(c.year)} ${esc(c.name)} / ${esc(c.booth||'ブース未取得')}</button>`).join('')||'<p>該当企業なし</p>';}
function renderEditor(){const c=state.companies.find(c=>c.id===selected);if(!c){$('editor').innerHTML='';return;}const r=record();$('editor').innerHTML=`<div class="card"><h2>${esc(c.name)}</h2><p>${esc(c.year)} / ${esc(c.booth||'ブース未取得')}</p><label>企業全体の自由メモ<textarea id="companyMemo">${esc(r.memo)}</textarea></label><h3>事前候補（記録には未追加）</h3>${(c.candidates||[]).map((p,n)=>`<div class="card"><b>${esc(p.name)}</b><p>概要：${esc(p.overview)}</p><p>調査理由：${esc(p.reason)}</p><p>質問：${esc(p.questions)}</p><details><summary>技術詳細・2024 差分・出典</summary><p>${esc(p.detail)}</p><p>2024 差分：${esc(p.difference)}</p><p>出典：${esc(p.source)}</p></details><button data-candidate="${n}">実際に見たので記録へ追加</button></div>`).join('')||'<p class="muted">事前候補なし</p>'}<button id="newItem">新規アイテムを記録</button><h3>実際に見たアイテム（${r.items.length} 件）</h3><div id="items">${r.items.map(itemHTML).join('')}</div></div>`;}
function itemHTML(i){return `<article class="card" data-item="${esc(i.id)}"><label>アイテム名<input type="text" data-field="name" value="${esc(i.name)}"></label><label>自由メモ<textarea data-field="note">${esc(i.note)}</textarea></label><label class="file">写真撮影<input type="file" accept="image/*" capture="environment" data-attach="photo"></label><label class="file">写真 / 音声ファイル取込<input type="file" accept="image/*,audio/*,.m4a,.wav,.mp3" multiple data-attach="file"></label><button data-record="${esc(i.id)}">録音開始</button><button data-stop="${esc(i.id)}" ${recordingItem===i.id?'':'disabled'}>録音停止</button><div class="attachments">${i.attachments.map(attachmentHTML).join('')}</div></article>`;}
function attachmentHTML(a){const type=a.data.slice(5,a.data.indexOf(';'));const safeType=/^(image\/(png|jpeg|gif|webp|heic|heif)|audio\/[a-z0-9.+-]+)$/i.test(type);return `<div class="attachment"><div>${esc(a.name)}</div>${safeType?(type.startsWith('image/')?`<img src="${esc(a.data)}" alt="${esc(a.name)}">`:`<audio controls src="${esc(a.data)}"></audio>`):'<p>この形式はプレビュー対象外</p>'}<small>${esc(a.addedAt||'')}</small></div>`;}
function addItem(candidate){const r=record();r.items.push({id:uid(),name:candidate?.name||'新規アイテム',note:'',candidate:candidate||null,observedAt:new Date().toISOString(),attachments:[]});save();renderEditor();}
function getItem(id){return record().items.find(i=>i.id===id);}
function dataURL(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file);});}
async function attach(files,id){try{const item=getItem(id);for(const file of files){item.attachments.push({name:file.name||'recording.webm',type:file.type,addedAt:new Date().toISOString(),data:await dataURL(file)});save();}renderEditor();}catch(e){alert('添付失敗：'+e.message);}}
$('search').oninput=renderList;
$('companies').onclick=e=>{if(e.target.dataset.company){if(recorder?.state==='recording'){alert('録音を停止してから企業を切り替えてください');return;}selected=e.target.dataset.company;renderEditor();}};
$('editor').oninput=e=>{if(e.target.id==='companyMemo')record().memo=e.target.value;else if(e.target.dataset.field)getItem(e.target.closest('[data-item]').dataset.item)[e.target.dataset.field]=e.target.value;else return;save();};
$('editor').onchange=e=>{if(e.target.dataset.attach)attach(Array.from(e.target.files),e.target.closest('[data-item]').dataset.item);};
$('editor').onclick=async e=>{if(e.target.id==='newItem')addItem();if(e.target.dataset.candidate!==undefined)addItem(state.companies.find(c=>c.id===selected).candidates[+e.target.dataset.candidate]);if(e.target.dataset.stop&&recorder?.state==='recording')recorder.stop();if(e.target.dataset.record){if(recorder?.state==='recording'){alert('現在の録音を停止してください');return;}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert('この環境では録音できません。iPhone のボイスメモ等で録音し、音声ファイルを取り込んでください。');return;}let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];recorder=new MediaRecorder(stream);recordingItem=e.target.dataset.record;const id=recordingItem;recorder.ondataavailable=ev=>{if(ev.data.size)chunks.push(ev.data);};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const file=new File(chunks,'recording-'+Date.now()+'.'+(recorder.mimeType.includes('mp4')?'m4a':'webm'),{type:recorder.mimeType});recordingItem=null;attach([file],id);};recorder.start();renderEditor();$('status').textContent='録音中：停止すると添付・保存します';}catch(err){stream?.getTracks().forEach(t=>t.stop());alert('録音できません：'+err.message+'。外部ボイスメモを取り込んでください。');}}};
function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent='書き出し要求済み：ファイル App で '+name+' の保存を確認してください';}
function filename(ext){return 'jimtof-field-'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+ext;}
$('jsonExport').onclick=()=>download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),filename('json'));
// ZIP STORE 方式。外部ライブラリ不要。添付は JSON 内の data URL に含める。
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0);}return (c^0xffffffff)>>>0;}
function zipStore(text){const name=new TextEncoder().encode('records.json'),data=new TextEncoder().encode(text),crc=crc32(data);const out=new Uint8Array(30+name.length+data.length+46+name.length+22),v=new DataView(out.buffer);const u16=(p,n)=>v.setUint16(p,n,true),u32=(p,n)=>v.setUint32(p,n,true);u32(0,0x04034b50);u16(4,20);u32(14,crc);u32(18,data.length);u32(22,data.length);u16(26,name.length);out.set(name,30);out.set(data,30+name.length);const c=30+name.length+data.length;u32(c,0x02014b50);u16(c+4,20);u16(c+6,20);u32(c+16,crc);u32(c+20,data.length);u32(c+24,data.length);u16(c+28,name.length);out.set(name,c+46);const end=c+46+name.length;u32(end,0x06054b50);u16(end+8,1);u16(end+10,1);u32(end+12,46+name.length);u32(end+16,c);return out;}
function unzipStore(buffer){const v=new DataView(buffer);if(v.byteLength<30||v.getUint32(0,true)!==0x04034b50)throw Error('ZIP 形式不正');if(v.getUint16(8,true)!==0||v.getUint16(6,true)!==0)throw Error('本 PoC が出力した非圧縮 ZIP を選択してください');const size=v.getUint32(18,true),offset=30+v.getUint16(26,true)+v.getUint16(28,true);if(offset+size>v.byteLength)throw Error('ZIP が途中で切れています');const bytes=new Uint8Array(buffer,offset,size);if(crc32(bytes)!==v.getUint32(14,true))throw Error('ZIP 整合性不一致');return new TextDecoder().decode(bytes);}
$('zipExport').onclick=()=>download(new Blob([zipStore(JSON.stringify(state))],{type:'application/zip'}),filename('zip'));
$('restore').onchange=async e=>{try{if(recorder?.state==='recording')throw Error('先に録音を停止してください');const f=e.target.files[0];if(!f)return;const s=JSON.parse(f.name.toLowerCase().endsWith('.zip')?unzipStore(await f.arrayBuffer()):await f.text());if(!valid(s))throw Error('バックアップ形式が異なります');if(!confirm('現在の '+Object.keys(state.records).length+' 社分の記録を、バックアップの '+Object.keys(s.records).length+' 社分で置き換えます。未出力データは先にバックアップしてください。復元しますか？'))return;state=s;selected=null;save();renderList();renderEditor();}catch(err){alert('復元失敗（現在の記録は保持）：'+err.message);}finally{e.target.value='';}};
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let n=0;n<text.length;n++){const c=text[n];if(c==='"'){if(quoted&&text[n+1]==='"'){field+='"';n++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(field);field='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[n+1]==='\n')n++;row.push(field);if(row.some(Boolean))rows.push(row);row=[];field='';}else field+=c;}if(quoted)throw Error('CSV の引用符が閉じていません');row.push(field);if(row.some(Boolean))rows.push(row);const headers=(rows.shift()||[]).map(h=>h.replace(/^\uFEFF/,'').trim());return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]||''])));}
function normalizeCompany(row,index,year){const pick=(...keys)=>keys.map(k=>row[k]).find(v=>v!==undefined&&v!=='')||'';const name=pick('name','company_name','exhibitor_name','company_name_ja','企業名','出展社名');if(!name)throw Error((index+1)+' 行目の企業名がありません');const y=String(pick('year','年度')||year),booth=String(pick('booth','booth_no','booth_number','ブース','小間番号'));if(!/^202[46]$/.test(y))throw Error('年度は 2024 または 2026 が必要です');return {id:'master-'+y+'-'+name+'-'+booth,year:y,name:String(name),booth,candidates:Array.isArray(row.candidates)?row.candidates:[],source:pick('detail_url','url','source_url','詳細URL')};}
$('master').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const text=await f.text();let rows=f.name.toLowerCase().endsWith('.csv')?parseCSV(text):JSON.parse(text);rows=Array.isArray(rows)?rows:rows.companies||rows.exhibitors;if(!Array.isArray(rows)||!rows.length)throw Error('企業の配列がありません');const year=f.name.match(/202[46]/)?.[0]||'';const incoming=rows.map((r,i)=>normalizeCompany(r,i,year)),map=new Map(state.companies.map(c=>[c.id,c]));incoming.forEach(c=>map.set(c.id,c));state.companies=[...map.values()];save();renderList();$('masterStatus').textContent=incoming.length+' 行取込。登録企業 '+state.companies.length+' 件（架空サンプル含む）。';}catch(err){alert('取込失敗：'+err.message);}finally{e.target.value='';}};
window.addEventListener('beforeunload',e=>{if(recorder?.state==='recording'){e.preventDefault();e.returnValue='録音中です';}});
renderList();
</script></html>
