<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 420" role="img" aria-labelledby="title desc"><title id="title">製造タスクと判断・実行の接続</title><desc id="desc">図面・要求から工程生成、検証、CNCとロボット、計測へ進み、測定値を条件補正と再計画へ戻す。構想と実装を混ぜない。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#467689"/></marker></defs><g font-family="Meiryo,sans-serif" fill="#17394a"><g fill="#e6f0f4" stroke="#90afbf"><rect x="10" y="65" width="205" height="170" rx="5"/><rect x="260" y="65" width="230" height="170" rx="5"/><rect x="535" y="65" width="220" height="170" rx="5"/><rect x="800" y="65" width="210" height="170" rx="5"/><rect x="1055" y="65" width="175" height="170" rx="5"/></g><g font-size="19" font-weight="bold"><text x="27" y="98">図面・要求・制約</text><text x="276" y="98">工程・動作の生成</text><text x="551" y="98">物理・幾何の検証</text><text x="817" y="98">設備での実行</text><text x="1070" y="98">測定・状態推定</text></g><g font-size="15"><text x="27" y="135">形状／材質／品質</text><text x="27" y="166">工具・治具・機械</text><text x="27" y="197">判断理由・過去結果</text><text x="276" y="135">FANUC／ENCY</text><text x="276" y="166">三菱電機タスク配分</text><text x="276" y="197">マザックは共同開発</text><text x="551" y="135">CAM・ツイン・切削物理</text><text x="551" y="166">ModuleWorks等</text><text x="551" y="197">実機適用前の承認</text><text x="817" y="135">CNC／ロボット</text><text x="817" y="166">機械API・制約内制御</text><text x="817" y="197">人の準備と例外対応</text><text x="1070" y="135">Renishaw／BLUM</text><text x="1070" y="166">TPR／Nagase</text><text x="1070" y="197">誤差と不確かさ</text></g><g stroke="#467689" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M215 148H255"/><path d="M490 148H530"/><path d="M755 148H795"/><path d="M1010 148H1050"/><path d="M1140 235V292H902V240"/><path d="M1140 294V363H374V240"/></g><g font-size="17"><text x="775" y="283">工具・座標・加工条件への補正</text><text x="431" y="351">品質・進捗・異常を工程案・生産計画へ戻す</text><text x="22" y="32">実装は部分ごと。図の全経路が単一製品で自律接続済みとは意味しない。</text><text x="22" y="405">横断基盤：現象に合う計測／部品・工具・工程ID／座標・時刻対応／モデル検証／判断履歴</text></g></g></svg>