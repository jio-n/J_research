<svg xmlns="http://www.w3.org/2000/svg" width="1930" height="1485" viewBox="0 0 1930 1485" role="img" aria-label="2024以前と2025年から2026年の変化パターン"><style>text{font-family:Meiryo,sans-serif}a:hover rect{stroke:#c58b22;stroke-width:2}</style><text x="25" y="39" font-size="28" font-weight="bold" fill="#203b50">2024以前 → 2025–2026｜何が変わり、何が未確定か</text><text x="25" y="74" font-size="17" font-weight="normal" fill="#203b50">出展説明と企業公式リリースの確認範囲。技術の初発明年や業界全体の一様な進化を表す図ではない。</text><rect x="20" y="101" width="250" height="48" rx="3" fill="#244b63"/><text x="32" y="132" font-size="18" font-weight="bold" fill="#ffffff">変化パターン</text><rect x="280" y="101" width="520" height="48" rx="3" fill="#244b63"/><text x="292" y="132" font-size="18" font-weight="bold" fill="#ffffff">2024以前に確認</text><rect x="810" y="101" width="550" height="48" rx="3" fill="#244b63"/><text x="822" y="132" font-size="18" font-weight="bold" fill="#ffffff">2025–2026に確認</text><rect x="1370" y="101" width="540" height="48" rx="3" fill="#244b63"/><text x="1382" y="132" font-size="18" font-weight="bold" fill="#ffffff">解釈・未確定</text><rect x="20" y="161" width="250" height="195" rx="3" fill="#e8f0f5"/><text x="32" y="188" font-size="16" font-weight="bold" fill="#203b50">Y01</text><text x="32" y="218" font-size="19" font-weight="normal" fill="#203b50">開発支援の対象を具体化</text><rect x="280" y="161" width="520" height="195" rx="3" fill="#f1f6f8"/><text x="292" y="190" font-size="18" font-weight="normal" fill="#203b50">2023のTwinCAT ChatはPLCコード作成等。ML Creatorは</text><text x="292" y="218" font-size="18" font-weight="normal" fill="#203b50">2024資料で学習・評価・ONNX。</text><rect x="810" y="161" width="550" height="195" rx="3" fill="#edf7f4"/><text x="822" y="190" font-size="18" font-weight="normal" fill="#203b50">CoAgentのI/O・HMI支援と専門家の確認・承認は2025/6に説明</text><text x="822" y="218" font-size="18" font-weight="normal" fill="#203b50">済み。2026はOperationsの診断・命令実行を説明。</text><rect x="1370" y="161" width="540" height="195" rx="3" fill="#fff5df"/><text x="1382" y="190" font-size="18" font-weight="normal" fill="#203b50">I/O・HMIを2026の初搭載としない。Operationsは製品発表・</text><text x="1382" y="218" font-size="18" font-weight="normal" fill="#203b50">投入時期要問合せ。個別の操作権限・復帰は未確認。</text><rect x="20" y="366" width="250" height="195" rx="3" fill="#e8f0f5"/><text x="32" y="393" font-size="16" font-weight="bold" fill="#203b50">Y02</text><text x="32" y="423" font-size="19" font-weight="normal" fill="#203b50">CAMは学習源と加工範囲</text><text x="32" y="452" font-size="19" font-weight="normal" fill="#203b50">で分岐</text><rect x="280" y="366" width="520" height="195" rx="3" fill="#f1f6f8"/><text x="292" y="395" font-size="18" font-weight="normal" fill="#203b50">CAM Assist／Mastercamは2024/7/25に提供発表。</text><text x="292" y="423" font-size="18" font-weight="normal" fill="#203b50">SolidCAMの2024展示はiMachining等。</text><rect x="810" y="366" width="550" height="195" rx="3" fill="#edf7f4"/><text x="822" y="395" font-size="18" font-weight="normal" fill="#203b50">SolidCAM 2025 SP4対応。ProPlanAIは2025.2導入説明→</text><text x="822" y="423" font-size="18" font-weight="normal" fill="#203b50">2026.1で旋削・複合・スイス型を商用拡張。</text><rect x="1370" y="366" width="540" height="195" rx="3" fill="#fff5df"/><text x="1382" y="395" font-size="18" font-weight="normal" fill="#203b50">ProPlanAIの2024同名資料なし。国内供給・会場版は要確認。</text><text x="1382" y="423" font-size="18" font-weight="normal" fill="#203b50">履歴予測と物理・加工ルール型を分ける。</text><rect x="20" y="571" width="250" height="195" rx="3" fill="#e8f0f5"/><text x="32" y="598" font-size="16" font-weight="bold" fill="#203b50">Y03</text><text x="32" y="628" font-size="19" font-weight="normal" fill="#203b50">既存の判定に人の調整・</text><text x="32" y="657" font-size="19" font-weight="normal" fill="#203b50">予測を追加</text><rect x="280" y="571" width="520" height="195" rx="3" fill="#f1f6f8"/><text x="292" y="600" font-size="18" font-weight="normal" fill="#203b50">Moriの摩耗判定・Muratecの診断は2024に存在。寿命推定研</text><text x="292" y="628" font-size="18" font-weight="normal" fill="#203b50">究は2023発表。</text><rect x="810" y="571" width="550" height="195" rx="3" fill="#edf7f4"/><text x="822" y="600" font-size="18" font-weight="normal" fill="#203b50">ZEROは2025/7/9販売開始、良否ラベルの追加学習。2026は</text><text x="822" y="628" font-size="18" font-weight="normal" fill="#203b50">Moriアナライザーの寿命・交換提案を具体掲載。</text><rect x="1370" y="571" width="540" height="195" rx="3" fill="#fff5df"/><text x="1382" y="600" font-size="18" font-weight="normal" fill="#203b50">診断→自動修理／交換とは確認できない。追加学習の更新採否</text><text x="1382" y="628" font-size="18" font-weight="normal" fill="#203b50">・実運用性能は別途確認。</text><rect x="20" y="776" width="250" height="195" rx="3" fill="#e8f0f5"/><text x="32" y="803" font-size="16" font-weight="bold" fill="#203b50">Y04</text><text x="32" y="833" font-size="19" font-weight="normal" fill="#203b50">物理作業と導入構成を拡</text><text x="32" y="862" font-size="19" font-weight="normal" fill="#203b50">張</text><rect x="280" y="776" width="520" height="195" rx="3" fill="#f1f6f8"/><text x="292" y="805" font-size="18" font-weight="normal" fill="#203b50">TR-20Wは搬入出。磁気＋2Dピック、MMKのCAPTO交換、</text><text x="292" y="833" font-size="18" font-weight="normal" fill="#203b50">イマオ同系列治具は2024に存在。</text><rect x="810" y="776" width="550" height="195" rx="3" fill="#edf7f4"/><text x="822" y="805" font-size="18" font-weight="normal" fill="#203b50">TR-20Wは切粉除去を参考出品。MMKはAdv後付け・単体販売、</text><text x="822" y="833" font-size="18" font-weight="normal" fill="#203b50">FNSは工程間統合、白山はAMR回収を説明。</text><rect x="1370" y="776" width="540" height="195" rx="3" fill="#fff5df"/><text x="1382" y="805" font-size="18" font-weight="normal" fill="#203b50">既存機構をAI新技術としない。カネテックのAI担当、再計画・</text><text x="1382" y="833" font-size="18" font-weight="normal" fill="#203b50">失敗復帰、実演範囲は未確認。</text><rect x="20" y="981" width="250" height="195" rx="3" fill="#e8f0f5"/><text x="32" y="1008" font-size="16" font-weight="bold" fill="#203b50">Y05</text><text x="32" y="1038" font-size="19" font-weight="normal" fill="#203b50">接続・監視基盤の具体化</text><rect x="280" y="981" width="520" height="195" rx="3" fill="#f1f6f8"/><text x="292" y="1010" font-size="18" font-weight="normal" fill="#203b50">たけびしは2024にOPC UA接続。ユシロは旧社名で遠隔監視</text><text x="292" y="1038" font-size="18" font-weight="normal" fill="#203b50">・濃度補給を掲載。</text><rect x="810" y="981" width="550" height="195" rx="3" fill="#edf7f4"/><text x="822" y="1010" font-size="18" font-weight="normal" fill="#203b50">2026はMCP Adapter提供計画、TRINIXのSimReady生成、</text><text x="822" y="1038" font-size="18" font-weight="normal" fill="#203b50">ALFREDのコントローラー・監視画面を説明。</text><rect x="1370" y="981" width="540" height="195" rx="3" fill="#fff5df"/><text x="1382" y="1010" font-size="18" font-weight="normal" fill="#203b50">ユシロを社名変更で照合。監視方式そのものは既存。ALFRED</text><text x="1382" y="1038" font-size="18" font-weight="normal" fill="#203b50">固有差・AI・自動補給は未確認。MCP計画と実装も分ける。</text><rect x="20" y="1186" width="250" height="195" rx="3" fill="#e8f0f5"/><text x="32" y="1213" font-size="16" font-weight="bold" fill="#203b50">Y06</text><text x="32" y="1243" font-size="19" font-weight="normal" fill="#203b50">別の実証と比較不能を残</text><text x="32" y="1272" font-size="19" font-weight="normal" fill="#203b50">す</text><rect x="280" y="1186" width="520" height="195" rx="3" fill="#f1f6f8"/><text x="292" y="1215" font-size="18" font-weight="normal" fill="#203b50">Toknの仮想CNC訓練はCompletion 2024。Panasonic等は</text><text x="292" y="1243" font-size="18" font-weight="normal" fill="#203b50">2024同名資料不足。</text><rect x="810" y="1186" width="550" height="195" rx="3" fill="#edf7f4"/><text x="822" y="1215" font-size="18" font-weight="normal" fill="#203b50">SiemensのHMND物流試験は2026/4ドイツの別実証。</text><text x="822" y="1243" font-size="18" font-weight="normal" fill="#203b50">Panasonicは2026/7に人の遠隔回避を具体確認。</text><rect x="1370" y="1186" width="540" height="195" rx="3" fill="#fff5df"/><text x="1382" y="1215" font-size="18" font-weight="normal" fill="#203b50">ToknからHMNDへの進化・接続は未確認。海外事例とJIMTOF</text><text x="1382" y="1243" font-size="18" font-weight="normal" fill="#203b50">展示機を同一視しない。人の介入を自律復帰としない。</text><text x="25" y="1413" font-size="16" font-weight="normal" fill="#203b50">根拠ID・比較対象の全カードは同じHTMLの年度比較表とExcel「横断比較・技術マップ」に収録。</text><text x="25" y="1439" font-size="15" font-weight="normal" fill="#203b50">研究候補は未採否の仮説。公開情報の不足は、各製品に機能がないことや現場の不具合を意味しない。</text></svg>