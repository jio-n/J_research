><text x="405" y="593" font-size="13">TwinCAT MLC</text><text x="405" y="618" font-size="15" font-weight="bold">学習モデル→制御実装</text><text x="565" y="635" font-size="10">FC014</text></a><rect x="624" y="560" width="227" height="185" fill="#f5f5f0"/><a href="#FC001"><rect x="633" y="572" width="209" height="70" rx="4" fill="white" stroke="#b7cdd7"/><text x="642" y="593" font-size="13">DMG森精機 AMR</text><text x="642" y="618" font-size="15" font-weight="bold">チップバケット搬送</text><text x="802" y="635" font-size="10">FC001</text></a><a href="#FC008"><rect x="633" y="650" width="209" height="70" rx="4" fill="white" stroke="#b7cdd7"/><text x="642" y="671" font-size="13">オークマ</text><text x="642" y="696" font-size="15" font-weight="bold">機内型／移動式ロボット</text><text x="802" y="713" font-size="10">FC008</text></a><rect x="861" y="560" width="227" height="185" fill="#f5f5f0"/><a href="#FC049"><rect x="870" y="572" width="209" height="70" rx="4" fill="white" stroke="#b7cdd7"/><text x="879" y="593" font-size="13">TR-20W〈参考出品〉</text><text x="879" y="618" font-size="15" font-weight="bold">主軸の切粉を除去</text><text x="1039" y="635" font-size="10">FC049</text></a><a href="#FC045"><rect x="870" y="650" width="209" height="70" rx="4" fill="white" stroke="#b7cdd7"/><text x="879" y="671" font-size="13">NTツール</text><text x="879" y="696" font-size="15" font-weight="bold">クーラントで切粉処理</text><text x="1039" y="713" font-size="10">FC045</text></a><rect x="1098" y="560" width="227" height="185" fill="#f5f5f0"/><a href="#FC033"><rect x="1107" y="572" width="209" height="70" rx="4" fill="white" stroke="#b7cdd7"/><text x="1116" y="593" font-size="13">レニショー</text><text x="1116" y="618" font-size="15" font-weight="bold">計測→工具オフセット</text><text x="1276" y="635" font-size="10">FC033</text></a><a href="#FC054"><rect x="1107" y="650" width="209" height="70" rx="4" fill="white" stroke="#b7cdd7"/><text x="1116" y="671" font-size="13">Wintech HGM-DX</text><text x="1116" y="696" font-size="15" font-weight="bold">厚み測定→研削補正</text><text x="1276" y="713" font-size="10">FC054</text></a><rect x="1335" y="560" width="227" height="185" fill="#f5f5f0"/><a href="#FC031"><rect x="1344" y="572" width="209" height="70" rx="4" fill="white" stroke="#b7cdd7"/><text x="1353" y="593" font-size="13">パナソニック</text><text x="1353" y="618" font-size="15" font-weight="bold">人が遠隔で例外対処</text><text x="1513" y="635" font-size="10">FC031</text></a><a href="#FC067"><rect x="1344" y="650" width="209" height="70" rx="4" fill="white" stroke="#b7cdd7"/><text x="1353" y="671" font-size="13">三菱商事テクノス</text><text x="1353" y="696" font-size="15" font-weight="bold">ロボットとAMRを連携</text><text x="1513" y="713" font-size="10">FC067</text></a><rect x="20" y="770" width="1557" height="73" rx="4" fill="#e9eef2"/><text x="35" y="798" font-size="18" font-weight="bold">共通基盤：データの意味・接続／撮像品質／IPC・分散I/O／機構・駆動要素</text><text x="35" y="827" font-size="16">たけびし OPC UA ／ 興和 耐環境撮像 ／ ケーメックス IPC・VARIO-X ／ イマオ 治具・指交換 ／ テクノダイナミックス 減速機</text><text x="35" y="877" font-size="17">人の境界：コード・工程案の採否、実機操作の承認、段取り準備、異常後の復帰。各カードに確認範囲を記載。</text><text x="35" y="910" font-size="16">AIの具体担当が不明な例：ファナック フィジカルAI CNC、DMG森精機の工作機械AIエージェント。役割を推定で埋めない。</text><text x="35" y="938" font-size="14">CoAgentの市場投入時期は要問い合わせ。Condition Agentと会場のエージェントの同一性は未確認。2026現地は未検証。</text></svg>