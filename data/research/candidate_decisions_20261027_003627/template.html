<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JIMTOF 追加候補の選定</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f7;color:#253d49;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Yu Gothic UI",Meiryo,sans-serif;overflow-wrap:anywhere}button,input,select,textarea{font:inherit}header{position:sticky;top:0;z-index:5;padding:6px 8px;background:white;border-bottom:1px solid #bdcdd6}.top{display:flex;align-items:center;justify-content:space-between;gap:5px}.top strong{font-size:16px}.top a,.top button{font-size:13px;min-height:34px;background:white;border:1px solid #b6cbd6;color:#175570;border-radius:4px;text-decoration:none;padding:5px 7px;white-space:nowrap}.top .actions{display:flex;gap:4px}.filters{display:flex;gap:5px;margin-top:6px}.filters input{width:40%;min-width:0;flex:1;padding:6px 8px;border:1px solid #b9ccd6;border-radius:4px;font-size:16px}.filters select{font-size:14px;max-width:128px;background:white;padding:5px;border:1px solid #b9ccd6;border-radius:4px}.status{font-size:12px;color:#57717f;margin-top:3px;display:flex;justify-content:space-between;gap:5px}.origin{font-size:12px;color:#496777;margin:2px 0}.hint{margin:0;font-size:12px;color:#305e74}main{max-width:1000px;margin:auto;padding:4px 6px 24px}.candidate{display:grid;grid-template-columns:34px minmax(0,1fr);border:1px solid #d0dce2;border-top:0;background:white}.candidate:first-child{border-top:1px solid #d0dce2}.candidate.chosen{border-left:4px solid #428760}.pick{display:flex;align-items:flex-start;justify-content:center;padding-top:18px;cursor:pointer;background:#f0f4f7;min-height:58px}.pick input{width:20px;height:20px;margin:0}.candidate.chosen .pick{background:#e4f0e8}.candidate details{min-width:0}.candidate>details>summary{display:block;list-style:none;padding:6px 8px;min-height:58px;cursor:pointer}.candidate>details>summary::-webkit-details-marker{display:none}.line{display:grid;grid-template-columns:minmax(0,1fr) auto 11px;gap:6px;align-items:center}.company{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.booth{font-size:13px;font-weight:650;white-space:nowrap}.arrow{font-size:12px;color:#4f7488}.candidate details[open]>summary .arrow{transform:rotate(90deg)}.preview{display:flex;gap:6px;color:#5b7280;font-size:12px;align-items:center;line-height:1.5;margin-top:2px}.preview .itemname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rownum{font-variant-numeric:tabular-nums;color:#6c8592;white-space:nowrap}.detail{border-top:1px solid #dce5eb;padding:9px 10px}.detail h3{font-size:17px;line-height:1.5;margin:0 0 5px}.tag{display:inline-block;background:#eaf0f4;border-radius:3px;font-size:12px;margin:2px 5px 2px 0;padding:2px 5px}.block{font-size:15px;white-space:pre-wrap;margin:8px 0}.block b{display:block;font-size:13px;color:#386174}.links{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.links a{color:#075e89;text-decoration:none;background:#eff5f8;border:1px solid #c6d8e2;border-radius:4px;padding:7px 8px;min-height:36px;font-size:14px}.more{font-size:14px;margin:8px 0}.more summary{cursor:pointer;background:#edf3f6;padding:7px;border-radius:4px;min-height:38px}.memo label{display:block;font-size:14px;font-weight:600}.memo textarea{width:100%;min-height:88px;margin-top:4px;resize:vertical;padding:7px;border:1px solid #a5bdca;border-radius:4px;background:#fffef5;font-size:16px}.already{font-size:12px;color:#795f19;background:#fff5d6;display:inline-block;padding:2px 6px}.selected-summary{font-size:14px;padding:8px;background:#e7f2ea;border:1px solid #bcd6c5;margin-bottom:6px}.empty{padding:24px;text-align:center;color:#557382}.alert{color:#a14519}dialog{max-width:min(94vw,500px);border:1px solid #afc5d2;border-radius:8px;padding:16px;color:#263f4e}dialog::backdrop{background:#0006}dialog h2{font-size:19px;margin:0 0 10px}dialog p{font-size:14px;margin:8px 0}dialog button{display:block;width:100%;padding:11px;margin:7px 0;text-align:left;font-size:16px;background:#eef5f8;border:1px solid #adc4d0;border-radius:5px}dialog .close{text-align:center;background:white}footer{max-width:1000px;margin:auto;padding:6px 14px 20px;font-size:12px;color:#5d7784}button,a,summary{-webkit-tap-highlight-color:transparent}button{cursor:pointer}.pick input:focus-visible,summary:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #126f9a;outline-offset:2px}body:has(dialog[open]){overflow:hidden}@media(min-width:1000px){header{padding-left:max(8px,calc((100% - 984px)/2));padding-right:max(8px,calc((100% - 984px)/2))}}
.candidate{grid-template-columns:76px minmax(0,1fr)}.decisions{display:grid;grid-template-columns:30px 42px;align-items:start;padding:5px 2px;background:#f0f4f7}.decision{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;font-size:11px;white-space:nowrap;gap:3px;cursor:pointer}.decision input{width:19px;height:19px;margin:0}.candidate.chosen .decisions{background:#e4f0e8}.candidate.rejected{border-left:4px solid #b47970}.candidate.rejected>details>summary{background:#f1eeee}.decision-title{font-size:12px;color:#607986;margin-top:3px}#exportScope{width:100%;padding:9px;border:1px solid #a9c2d0;border-radius:4px;background:white;font:inherit}.export-scope-label{display:block;font-size:14px;margin:8px 0 3px}</style></head><body><header><div class="top"><strong>追加候補の選定</strong><div class="actions"><a href="https://jio-n.github.io/J_research/">訪問一覧</a><button id="selectedBtn" type="button">選択0</button><button id="exportBtn" type="button">書出</button></div></div><div class="filters"><input id="search" type="search" aria-label="候補を検索" placeholder="企業・技術・タスク"><select id="tag" aria-label="四タグ"><option value="">全タグ</option><option>AI</option><option>フィジカルAI</option><option>自律化</option><option>自動化</option></select></div><div class="filters"><select id="mode" aria-label="選択状態"><option value="all">全候補</option><option value="selected">行く</option><option value="rejected">行かない</option><option value="undecided">未判断</option><option value="remaining">行かないを除く</option></select><select id="hall" aria-label="展示棟"><option value="">全展示棟</option><option value="E">東</option><option value="S">南</option><option value="W">西</option></select><span id="saveStatus" class="origin" aria-live="polite">端末内保存</span></div><div class="status"><span id="count"></span><span id="sourceRange"></span></div><p class="hint">行く／行かないは片方だけ。両方空欄＝未判断</p></header><main id="content"></main><footer>行く／行かない／未判断を保存します。訪問済みとは別です。判断とメモはこのブラウザ内に自動保存。元Excelの90行目以降を全件保持し、未選択を非該当とは扱いません。</footer><dialog id="exportDialog"><h2>候補の判断を書き出す</h2><p id="selectionCount"></p><label class="export-scope-label" for="exportScope">出力対象</label><select id="exportScope"><option value="go">行くのみ</option><option value="remaining">行かないを除く（行く＋未判断）</option><option value="no">行かないのみ</option><option value="all">全件・判断履歴</option></select><button id="selectedView" type="button">行くのみ表示</button><button id="exportHtml" type="button">指定対象の一覧HTMLを保存</button><button id="exportCsv" type="button">指定対象のCSVを保存（Excel用）</button><button id="exportJson" type="button">指定対象の統合用JSONを保存</button><button id="backupHtml" type="button">全候補＋判断状態のHTMLを保存</button><p id="exportStatus" aria-live="polite"></p><p>JSONは行く／行かない／未判断、候補ID・元Excel行・詳細・根拠リンク・自分のメモを含みます。後でこのファイルを渡せば、選択したアイテムを訪問HTMLへ統合できます。選択やメモはGitHubへ送信されません。</p><button class="close" type="button" id="closeDialog">閉じる</button></dialog><script type="application/json" id="pickerData">__PICKER_DATA__</script><script type="application/json" id="selectionSeed">{}</script><script>
'use strict';const data=JSON.parse(document.getElementById('pickerData').textContent),KEY='jimtof2026_candidate_selection_rows90_v1',content=document.getElementById('content'),search=document.getElementById('search'),tag=document.getElementById('tag'),mode=document.getElementById('mode'),hall=document.getElementById('hall'),saveStatus=document.getElementById('saveStatus'),valid=new Set(data.items.map(x=>x.id));let state={};
function parse(s){try{const v=JSON.parse(s||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch{return {}}}function merge(v){for(const[id,x]of Object.entries(v)){if(!valid.has(id)||!x||typeof x!=='object')continue;const decision=['go','no','pending'].includes(x.decision)?x.decision:(x.selected===true?'go':'pending');const e={decision,selected:decision==='go',note:typeof x.note==='string'?x.note:'',updatedAt:typeof x.updatedAt==='string'?x.updatedAt:''};if(!state[id]||(Date.parse(e.updatedAt)||0)>(Date.parse(state[id].updatedAt)||0))state[id]=e;}}merge(parse(document.getElementById('selectionSeed').textContent));let storageOK=true;try{merge(parse(localStorage.getItem(KEY)))}catch{storageOK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));saveStatus.textContent='端末内に保存済み';saveStatus.classList.remove('alert');return true}catch{saveStatus.textContent='保存不可・HTMLを書出';saveStatus.classList.add('alert');return false}}function el(t,c,text){const x=document.createElement(t);if(c)x.className=c;if(text!==undefined)x.textContent=text;return x}function a(label,url){if(!/^https:\/\//i.test(url||''))return null;const n=el('a','',label);n.href=url;n.target='_blank';n.rel='noopener';return n}function block(title,text){const n=el('p','block');n.append(el('b','',title),document.createTextNode(text||'未確認・未記載'));return n}
function decision(id){return state[id]?.decision||'pending'}
function selected(){return data.items.filter(x=>decision(x.id)==='go')}
function exportItems(){const scope=document.getElementById('exportScope').value;return data.items.filter(x=>scope==='all'||(scope==='remaining'?decision(x.id)!=='no':decision(x.id)===scope))}
function decisionLabel(id){return {go:'行く',no:'行かない',pending:'未判断'}[decision(id)]}
function counts(){const go=selected().length,no=data.items.filter(x=>decision(x.id)==='no').length,pending=data.items.length-go-no;document.getElementById('selectedBtn').textContent='行く'+go;document.getElementById('selectionCount').textContent='行く '+go+'件／行かない '+no+'件／未判断 '+pending+'件';}
function update(id,patch){const old={decision:'pending',selected:false,note:'',...state[id]};state[id]={...old,...patch,updatedAt:new Date().toISOString()};state[id].selected=state[id].decision==='go';save();counts();const n=document.getElementById('candidate-'+id);if(n){n.classList.toggle('chosen',decision(id)==='go');n.classList.toggle('rejected',decision(id)==='no');for(const cb of n.querySelectorAll('.decisions input'))cb.checked=cb.dataset.decision===decision(id);}}
function detail(x){const d=el('div','detail');d.append(el('h3','',x.company),block('注目アイテム',x.item));if(x.alreadyListedCompany)d.append(el('p','already','この企業は訪問一覧に登録済み（別アイテムの可能性あり）'));const tags=el('div','');for(const[t,status]of Object.entries(x.tags))if(status!=='—')tags.append(el('span','tag',t+'：'+status));d.append(tags,block('展示確度',x.exhibit),block('対象タスク',x.task),block('実現方式・担当機能',x.method),block('注目理由',x.reason),block('現地で聞くこと',x.questions));const links=el('div','links');for(const[label,url]of[['出展者ページ',x.companyUrl],['アイテム技術資料',x.url],[x.extraLabel||'追加技術資料',x.extraUrl]]){const n=a(label,url);if(n)links.append(n)}d.append(links);const more=el('details','more');more.append(el('summary','','入力・出力・人の担当・タグ根拠・出典'));for(const[label,text]of[['入力データ',x.input],['出力・変える量',x.output],['人が担当する部分',x.human],['適用限界・未確認',x.limits],['調査深度',x.depth],['判断履歴（台帳作成時）',x.history]])more.append(block(label,text));for(const[t,reason]of Object.entries(x.tagReasons))if(x.tags[t]!=='—')more.append(block(t+'の該当理由',reason));for(const s of x.sources){const link=a(s.title||'原典',s.url);if(link){const p=el('p','');p.append(link);if(s.publisher||s.locator)p.append(el('span','', '\n'+[s.publisher,s.locator].filter(Boolean).join('／')));more.append(p)}}d.append(more);const m=el('div','memo'),label=el('label','','採用理由・自分のメモ'),ta=el('textarea','');ta.id='note-'+x.id;label.htmlFor=ta.id;ta.value=state[x.id]?.note||'';ta.placeholder='何を見たいか・追加したい理由';ta.addEventListener('input',()=>update(x.id,{note:ta.value}));m.append(label,ta);d.append(m);return d;}
function matches(x){const term=search.value.trim().toLocaleLowerCase();return(!term||JSON.stringify([x.company,x.item,x.task,x.method,x.excelRow,state[x.id]?.note]).toLocaleLowerCase().includes(term))&&(!tag.value||x.tags[tag.value]!=='—')&&(!hall.value||x.booth.includes(hall.value))&&(mode.value!=='selected'||decision(x.id)==='go')&&(mode.value!=='rejected'||decision(x.id)==='no')&&(mode.value!=='undecided'||decision(x.id)==='pending')&&(mode.value!=='remaining'||decision(x.id)!=='no')}
function render(){const open=new Set([...content.querySelectorAll('details.candidate-detail[open]')].map(x=>x.dataset.id));content.replaceChildren();const rows=data.items.filter(matches);if(mode.value==='selected')content.append(el('p','selected-summary','行く '+selected().length+'件'));if(mode.value==='remaining')content.append(el('p','selected-summary','行かないを除いた候補。未判断は行くと確定していません。'));for(const x of rows){const row=el('article','candidate');row.id='candidate-'+x.id;row.classList.toggle('chosen',decision(x.id)==='go');row.classList.toggle('rejected',decision(x.id)==='no');const controls=el('div','decisions');for(const[value,text]of[['go','行く'],['no','行かない']]){const label=el('label','decision'),cb=el('input','');cb.type='checkbox';cb.dataset.decision=value;cb.checked=decision(x.id)===value;cb.setAttribute('aria-label',x.company+' '+x.item+' '+text);cb.addEventListener('change',()=>{update(x.id,{decision:cb.checked?value:'pending'});if(mode.value!=='all')render()});label.append(cb,document.createTextNode(text));controls.append(label);}const det=el('details','candidate-detail');det.dataset.id=x.id;const sum=el('summary',''),line=el('span','line');line.append(el('span','company',x.shortName),el('span','booth',x.booth.match(/[EWS]\d+/)?.[0]||x.booth),el('span','arrow','▶'));const preview=el('span','preview');preview.append(el('span','itemname',x.item),el('span','rownum','行'+x.excelRow));sum.append(line,preview);det.append(sum);det.addEventListener('toggle',()=>{if(det.open&&!det.querySelector('.detail'))det.append(detail(x))});if(open.has(x.id)){det.open=true;det.append(detail(x))}row.append(controls,det);content.append(row)}if(!rows.length)content.append(el('p','empty','該当する候補はありません。検索・タグ・選択状態を変更してください。'));document.getElementById('count').textContent=rows.length+'件表示／'+data.items.length+'候補';document.getElementById('sourceRange').textContent='Excel行90–302';counts();}
for(const n of[search,tag,mode,hall])n.addEventListener(n===search?'input':'change',render);document.getElementById('selectedBtn').onclick=()=>{mode.value=mode.value==='selected'?'all':'selected';search.value='';tag.value='';hall.value='';render();window.scrollTo(0,0)};document.getElementById('exportBtn').onclick=()=>{counts();document.getElementById('exportDialog').showModal()};document.getElementById('closeDialog').onclick=()=>document.getElementById('exportDialog').close();document.getElementById('selectedView').onclick=()=>{document.getElementById('exportDialog').close();mode.value='selected';search.value='';tag.value='';hall.value='';render();window.scrollTo(0,0)};
function stamp(){return new Date().toISOString().replace(/[-:]/g,'').slice(0,15).replace('T','_')}function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);document.getElementById('exportStatus').textContent='書き出しました：'+name}function requireSelection(){if(exportItems().length)return true;document.getElementById('exportStatus').textContent='この出力対象に該当する候補はありません。出力対象を変更してください。';return false}
function exportHtml(onlySelected){if(onlySelected&&!requireSelection())return;save();const root=document.documentElement.cloneNode(true),items=onlySelected?exportItems():data.items,ids=new Set(items.map(x=>x.id)),seed=Object.fromEntries(Object.entries(state).filter(([id])=>ids.has(id)));root.querySelector('#pickerData').textContent=JSON.stringify({...data,items}).replace(/</g,'\\u003c');root.querySelector('#selectionSeed').textContent=JSON.stringify(seed).replace(/</g,'\\u003c');root.querySelector('#content').replaceChildren();if(onlySelected){root.querySelector('.top strong').textContent='出力した候補';root.querySelector('footer').textContent='指定した出力対象の候補を収録。行く／行かない／未判断、元Excelの行番号と候補IDを保持しています。';}root.querySelector('#exportDialog').removeAttribute('open');root.querySelector('#exportStatus').textContent='';dl(new Blob(['<!doctype html>\n'+root.outerHTML],{type:'text/html;charset=utf-8'}),'JIMTOF2026_'+(onlySelected?'候補判断一覧':'候補判断バックアップ')+'_'+stamp()+'.html')}
document.getElementById('exportHtml').onclick=()=>exportHtml(true);document.getElementById('backupHtml').onclick=()=>exportHtml(false);document.getElementById('exportJson').onclick=()=>{if(!requireSelection())return;save();const result={schema:'jimtof2026-selected-candidates/v2',filterScope:document.getElementById('exportScope').value,exportedAt:new Date().toISOString(),sourceWorkbook:data.sourceWorkbook,sourceSheet:data.sourceSheet,sourceRows:[90,302],items:exportItems().map(x=>({...x,selection:{decision:decision(x.id),selected:decision(x.id)==='go',note:state[x.id]?.note||'',updatedAt:state[x.id]?.updatedAt||''}}))};dl(new Blob([JSON.stringify(result,null,2)],{type:'application/json;charset=utf-8'}),'JIMTOF2026_訪問HTML統合用_'+stamp()+'.json')};
function csv(v){let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}document.getElementById('exportCsv').onclick=()=>{if(!requireSelection())return;save();const rows=[['元Excel行','候補ID','企業名','ブース','注目アイテム','AI','フィジカルAI','自律化','自動化','対象タスク','方式','注目理由','展示確度','現地で聞くこと','採用理由・メモ','技術URL','出展者URL','訪問判断']];for(const x of exportItems())rows.push([x.excelRow,x.id,x.company,x.booth,x.item,...Object.values(x.tags),x.task,x.method,x.reason,x.exhibit,x.questions,state[x.id]?.note||'',x.url,x.companyUrl,decisionLabel(x.id)]);dl(new Blob(['\ufeff'+rows.map(r=>r.map(csv).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'JIMTOF2026_候補判断_'+stamp()+'.csv')};window.addEventListener('pagehide',save);render();if(Object.keys(state).length||!storageOK)save();
</script></body></html>
